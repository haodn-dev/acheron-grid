name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        description: Always run release verification when called by another workflow
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true
          package-manager-cache: false
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          FORCE_FULL: ${{ inputs.force_full || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
  docs:
    name: Documentation
    needs: scope
    if: needs.scope.outputs.runtime == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:docs
        env:
          CI_CHANGED_FILES: ${{ needs.scope.outputs.files }}
  browser-smoke:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --workers=1
        env:
          ACHERON_TEST_BROWSER: ${{ matrix.browser }}
      - name: Portable standalone playground
        run: npx playwright test --config playground.config.mjs --workers=1 --output=playground-results
        env:
          ACHERON_TEST_BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playground-report
      - name: Portable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
            playground-results/
            playground-report/
          retention-days: 7
          if-no-files-found: ignore
  verify:
    name: verify (${{ matrix.node }})
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            version: '>=22.23.4 <23'
          - node: 24
            version: '>=24.22.1 <25'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
          check-latest: true
          cache: npm
      - run: npm ci
      - run: node --test tests/ci.node.mjs
      - run: npm run test:release
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:docs
        env:
          CI_CHANGED_FILES: ${{ needs.scope.outputs.files }}
      - run: npm run test:mcp
      - run: npm pack --dry-run --workspaces
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: npx playwright test --workers=1
      - name: Benchmark correctness and raw samples
        run: npx playwright test --config benchmark.config.mjs --repeat-each=3 --reporter=json --output=benchmark-artifacts > benchmark-report.json
      - name: Headless benchmark correctness
        run: node --expose-gc tests/benchmark-core.mjs > benchmark-core-report.json
      - name: Operational workload correctness
        run: node tests/benchmark-operational.mjs > benchmark-operational-report.json
      - name: Live and chart benchmark correctness
        run: node tests/benchmark-live-charts.mjs > benchmark-live-charts-report.json
      - name: Benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-node-${{ matrix.node }}
          path: |
            benchmark-report.json
            benchmark-core-report.json
            benchmark-operational-report.json
            benchmark-live-charts-report.json
            benchmark-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Standalone playground
        run: npx playwright test --config playground.config.mjs --workers=1 --output=playground-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playground-report
      - name: Independent packed consumer
        run: npm run test:package
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
            playground-results/
            playground-report/
          retention-days: 7
          if-no-files-found: ignore
  result:
    name: CI result
    if: always()
    needs: [scope, docs, verify, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
          DOCS: ${{ needs.docs.result }}
          NODE: ${{ needs.verify.result }}
          BROWSERS: ${{ needs.browser-smoke.result }}
        run: |
          test "$SCOPE" = success
          if [ "$RUNTIME" = true ]; then
            test "$NODE" = success
            test "$BROWSERS" = success
          else
            test "$DOCS" = success
          fi
