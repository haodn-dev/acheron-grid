name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run --workspaces
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: npx playwright test --workers=1
      - name: Standalone playground
        run: npx playwright test --config playground.config.mjs --workers=1 --output=playground-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playground-report
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
            playground-results/
            playground-report/
          retention-days: 7
          if-no-files-found: ignore
