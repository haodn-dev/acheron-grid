name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser integration ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --workers=1
        env:
          ACHERON_TEST_BROWSER: ${{ matrix.browser }}
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:docs
      - run: npm run test:mcp
      - run: npm pack --dry-run --workspaces
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: npx playwright test --workers=1
      - name: Benchmark correctness and raw samples
        run: npx playwright test --config benchmark.config.mjs --repeat-each=3 --reporter=json --output=benchmark-artifacts > benchmark-report.json
      - name: Headless benchmark correctness
        run: node --expose-gc tests/benchmark-core.mjs > benchmark-core-report.json
      - name: Live and chart benchmark correctness
        run: node tests/benchmark-live-charts.mjs > benchmark-live-charts-report.json
      - name: Benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-node-${{ matrix.node }}
          path: |
            benchmark-report.json
            benchmark-core-report.json
            benchmark-live-charts-report.json
            benchmark-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Standalone playground
        run: npx playwright test --config playground.config.mjs --workers=1 --output=playground-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playground-report
      - name: Independent packed consumer
        run: npm run test:package
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
            playground-results/
            playground-report/
          retention-days: 7
          if-no-files-found: ignore
